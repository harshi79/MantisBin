name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

      # The checklist an operator runs after a deploy, rehearsed on every push:
      # start the local server (same app code as the Worker, in-memory SQLite)
      # and walk the editor, docs, API and headers with the smoke script.
      - name: Smoke test the served surface
        if: matrix.node == 22
        run: |
          DB_FILE=:memory: PORT=8787 node scripts/dev.js &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          node scripts/smoke.js http://127.0.0.1:8787
