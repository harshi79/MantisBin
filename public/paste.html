<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MantisBin - Loading...</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦗</text></svg>">
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent: #2ea043;
      --error: #f85149;
      --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-primary);
      text-decoration: none;
    }

    .logo:hover {
      opacity: 0.8;
    }

    .paste-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .paste-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-tertiary);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .paste-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .paste-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      align-items: center;
      flex-wrap: wrap;
    }

    .paste-content-wrapper {
      position: relative;
    }

    .paste-content {
      padding: 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
      max-height: 70vh;
      overflow-y: auto;
    }

    .action-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: #3fb950;
    }

    .btn-secondary {
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .loading-state,
    .error-state,
    .not-found-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message,
    .not-found-message {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1rem;
      }

      .paste-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .action-bar {
        width: 100%;
      }

      .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="logo">
        <span>🦗</span>
        MantisBin
      </a>
    </header>

    <main id="mainContent">
      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <p>Loading paste...</p>
      </div>

      <div class="error-state hidden" id="errorState">
        <p class="error-message" id="errorMessage"></p>
        <a href="/" class="btn btn-primary">Create New Paste</a>
      </div>

      <div class="not-found-state hidden" id="notFoundState">
        <h2 style="margin-bottom: 0.5rem;">Paste Not Found</h2>
        <p class="not-found-message">This paste may have expired or been deleted.</p>
        <a href="/" class="btn btn-primary">Create New Paste</a>
      </div>

      <div class="paste-container hidden" id="pasteContainer">
        <div class="paste-header">
          <h1 class="paste-title" id="pasteTitle">Untitled</h1>
          <div class="paste-meta">
            <span id="pasteDate"></span>
            <span>•</span>
            <span id="pasteViews">0 views</span>
          </div>
          <div class="action-bar">
            <button class="btn btn-primary" id="copyBtn">Copy Content</button>
            <button class="btn btn-secondary" id="shareBtn">Share URL</button>
          </div>
        </div>
        <div class="paste-content-wrapper">
          <pre class="paste-content" id="pasteContent"></pre>
        </div>
      </div>
    </main>

    <footer>
      <p>MantisBin — Open source on <a href="https://github.com/MantisBin/MantisBin" target="_blank">GitHub</a></p>
    </footer>
  </div>

  <script>
    const pasteId = window.location.pathname.split('/').pop();
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const notFoundState = document.getElementById('notFoundState');
    const pasteContainer = document.getElementById('pasteContainer');
    const errorMessage = document.getElementById('errorMessage');
    const pasteTitle = document.getElementById('pasteTitle');
    const pasteDate = document.getElementById('pasteDate');
    const pasteViews = document.getElementById('pasteViews');
    const pasteContent = document.getElementById('pasteContent');
    const copyBtn = document.getElementById('copyBtn');
    const shareBtn = document.getElementById('shareBtn');

    async function loadPaste() {
      if (!pasteId || !/^[a-zA-Z0-9]{12}$/.test(pasteId)) {
        showNotFound();
        return;
      }

      try {
        const response = await fetch(`/api/paste/${pasteId}`);
        
        if (!response.ok) {
          const data = await response.json();
          if (response.status === 404) {
            showNotFound();
          } else {
            showError(data.error || 'Failed to load paste');
          }
          return;
        }

        const paste = await response.json();
        displayPaste(paste);
      } catch (err) {
        showError('Network error. Please try again.');
      }
    }

    function displayPaste(paste) {
      loadingState.classList.add('hidden');
      
      if (paste.title) {
        pasteTitle.textContent = paste.title;
        document.title = `${paste.title} - MantisBin`;
      } else {
        pasteTitle.textContent = 'Untitled Paste';
        document.title = 'Untitled Paste - MantisBin';
      }

      const date = new Date(paste.createdAt * 1000);
      pasteDate.textContent = date.toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      pasteViews.textContent = `${paste.views} view${paste.views !== 1 ? 's' : ''}`;
      pasteContent.textContent = paste.content;
      pasteContainer.classList.remove('hidden');
    }

    function showError(message) {
      loadingState.classList.add('hidden');
      errorMessage.textContent = message;
      errorState.classList.remove('hidden');
    }

    function showNotFound() {
      loadingState.classList.add('hidden');
      notFoundState.classList.remove('hidden');
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(pasteContent.textContent);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy Content';
        }, 2000);
      } catch {
        const range = document.createRange();
        range.selectNode(pasteContent);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy Content';
        }, 2000);
      }
    });

    shareBtn.addEventListener('click', async () => {
      const url = window.location.href;
      try {
        await navigator.clipboard.writeText(url);
        shareBtn.textContent = 'URL Copied!';
        setTimeout(() => {
          shareBtn.textContent = 'Share URL';
        }, 2000);
      } catch {
        prompt('Copy this URL:', url);
      }
    });

    loadPaste();
  </script>
</body>
</html>
