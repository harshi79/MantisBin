<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MantisBin - Stay sharp. Paste faster.</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦗</text></svg>">
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent: #2ea043;
      --accent-hover: #3fb950;
      --error: #f85149;
      --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .logo-icon {
      font-size: 2.75rem;
    }

    .tagline {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .paste-form {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      min-height: 300px;
      resize: vertical;
      line-height: 1.5;
    }

    .options-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .option-group {
      flex: 1;
      min-width: 150px;
    }

    select {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .result-section {
      display: none;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }

    .result-section.show {
      display: block;
    }

    .success-message {
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .url-display {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .url-input {
      flex: 1;
      padding: 0.75rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.875rem;
    }

    .error-message {
      color: var(--error);
      font-size: 0.875rem;
      margin-top: 0.5rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1rem;
      }

      .logo {
        font-size: 2rem;
      }

      .options-row {
        flex-direction: column;
      }

      .option-group {
        width: 100%;
      }

      .btn {
        width: 100%;
      }

      .url-display {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="logo">
        <span class="logo-icon">🦗</span>
        MantisBin
      </h1>
      <p class="tagline">Stay sharp. Paste faster.</p>
    </header>

    <main>
      <form class="paste-form" id="pasteForm">
        <div class="form-group">
          <label for="title">Title (optional)</label>
          <input type="text" id="title" name="title" placeholder="My awesome paste" maxlength="200">
        </div>

        <div class="form-group">
          <label for="content">Content *</label>
          <textarea id="content" name="content" placeholder="Paste your code, text, or anything here..." required></textarea>
          <p class="error-message" id="contentError"></p>
        </div>

        <div class="options-row">
          <div class="option-group">
            <label for="visibility">Visibility</label>
            <select id="visibility" name="visibility">
              <option value="public">Public</option>
              <option value="unlisted">Unlisted</option>
            </select>
          </div>

          <div class="option-group">
            <label for="expiresIn">Expires In</label>
            <select id="expiresIn" name="expiresIn">
              <option value="">Never</option>
              <option value="3600">1 hour</option>
              <option value="86400">1 day</option>
              <option value="604800">1 week</option>
              <option value="2592000">30 days</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span>Create Paste</span>
          </button>
        </div>
      </form>

      <div class="result-section" id="resultSection">
        <p class="success-message">✓ Paste created successfully!</p>
        <div class="url-display">
          <input type="text" class="url-input" id="pasteUrl" readonly>
          <button class="btn btn-secondary" id="copyBtn">Copy URL</button>
          <a href="" class="btn btn-secondary" id="viewBtn" target="_blank">View</a>
        </div>
      </div>
    </main>

    <footer>
      <p>MantisBin — Open source on <a href="https://github.com/MantisBin/MantisBin" target="_blank">GitHub</a></p>
    </footer>
  </div>

  <script>
    const form = document.getElementById('pasteForm');
    const contentInput = document.getElementById('content');
    const contentError = document.getElementById('contentError');
    const resultSection = document.getElementById('resultSection');
    const pasteUrlInput = document.getElementById('pasteUrl');
    const copyBtn = document.getElementById('copyBtn');
    const viewBtn = document.getElementById('viewBtn');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const content = contentInput.value.trim();
      if (!content) {
        contentError.textContent = 'Content is required.';
        contentError.classList.add('show');
        return;
      }

      contentError.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      try {
        const response = await fetch('/api/paste', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: document.getElementById('title').value.trim() || null,
            content,
            visibility: document.getElementById('visibility').value,
            expiresIn: document.getElementById('expiresIn').value || null,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to create paste');
        }

        pasteUrlInput.value = data.fullUrl;
        viewBtn.href = data.url;
        resultSection.classList.add('show');
        contentInput.value = '';
        document.getElementById('title').value = '';

      } catch (err) {
        contentError.textContent = err.message;
        contentError.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(pasteUrlInput.value);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy URL';
        }, 2000);
      } catch {
        pasteUrlInput.select();
        document.execCommand('copy');
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy URL';
        }, 2000);
      }
    });
  </script>
</body>
</html>
